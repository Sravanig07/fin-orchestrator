server:
  port: 8088

spring:
  application:
    name: ai-orchestrator

mcp:
  servers:
    finance: ${MCP_FINANCE_URL:http://localhost:8091}
    contract: ${MCP_CONTRACT_URL:http://localhost:8092}
    risk: ${MCP_RISK_URL:http://localhost:8093}
    notification: ${MCP_NOTIFICATION_URL:http://localhost:8094}

services:
  audit-service: ${AUDIT_SERVICE_URL:http://localhost:8087}

finorchestrator:
  llm:
    # Options: hybrid | ollama | cloud | mock
    provider: ${LLM_PROVIDER:hybrid}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b-instruct}
      temperature: 0.1

    cloud:
      provider-type: groq
      endpoint: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      temperature: 0.1
      max-tokens: 2048

    routing:
      privacy-first: true
      fallback-enabled: true
      local-timeout-ms: 4000

resilience4j:
  circuitbreaker:
    instances:
      mcpTools:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 3
      llmProvider:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 4000ms
  retry:
    instances:
      mcpTools:
        max-attempts: 2
        wait-duration: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
