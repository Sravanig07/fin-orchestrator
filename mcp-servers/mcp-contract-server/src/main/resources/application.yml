server:
  port: 8092

spring:
  application:
    name: mcp-contract-server

services:
  contract-service: ${CONTRACT_SERVICE_URL:http://localhost:8083}
  document-service: ${DOCUMENT_SERVICE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
